<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>roitcore Links</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /*
    Layout: single scroll-free broadcast card — avatar + live-status chip up top,
    link "stream deck" buttons stacked below, socials as an icon dock at the foot.
    Color: late-night broadcast — deep ink background, signal-red accent from the logo art.
    Type: Unbounded (display, geometric/broadcast feel) + Inter (body/UI).
  */
  :root{
    --bg: #0a0809;
    --scrim-1: rgba(8,6,7,.62);
    --scrim-2: rgba(8,6,7,.92);
    --panel: rgba(20,14,15,.72);
    --panel-border: rgba(226,48,58,.35);
    --fg: #f5eeee;
    --fg-dim: #c7b9ba;
    --accent: #e2303f;
    --accent-2: #ff8a93;
    --live: #e2303f;
    --focus: #ff8a93;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --scrim-1: rgba(10,8,8,.68);
      --scrim-2: rgba(10,8,8,.94);
      --panel: rgba(255,255,255,.88);
      --panel-border: rgba(226,48,58,.3);
      --fg: #201012;
      --fg-dim: #5c484a;
      --accent: #c81f2d;
      --accent-2: #9c1620;
      --live: #c81f2d;
      --focus: #c81f2d;
      color-scheme: light;
    }
  }
  :root[data-theme="light"]{
    --scrim-1: rgba(10,8,8,.68);
    --scrim-2: rgba(10,8,8,.94);
    --panel: rgba(255,255,255,.88);
    --panel-border: rgba(226,48,58,.3);
    --fg: #201012;
    --fg-dim: #5c484a;
    --accent: #c81f2d;
    --accent-2: #9c1620;
    --live: #c81f2d;
    --focus: #c81f2d;
    color-scheme: light;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100%;
    background:
      linear-gradient(180deg, var(--scrim-1) 0%, var(--scrim-2) 62%, var(--bg) 100%),
      url("img/banner.png") center 18% / cover no-repeat,
      var(--bg);
    background-attachment: fixed, fixed, fixed;
    color:var(--fg);
    font-family:"Inter", system-ui, -apple-system, sans-serif;
    display:flex;
    justify-content:center;
    padding-inline: max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px));
    padding-block: 40px 48px;
  }
  @media (max-width: 500px){
    body{ background-attachment: scroll, scroll, scroll; }
  }

  h1,h2,.brand{font-family:"Unbounded", "Inter", system-ui, sans-serif}

  .page{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  .avatar-wrap{
    position:relative;
    width:112px;
    height:112px;
  }
  .avatar{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:2px solid var(--accent);
    box-shadow: 0 0 0 5px var(--scrim-2), 0 8px 24px rgba(226,48,58,.35);
  }
  .live-chip{
    position:absolute;
    bottom:-6px;
    left:50%;
    transform:translateX(-50%);
    background:var(--live);
    color:#fff;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:3px 10px;
    border-radius:999px;
    border:2px solid var(--bg);
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
  }
  .live-dot{
    width:6px;height:6px;border-radius:50%;background:#fff;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .live-dot{animation:none} }
  @keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:.35}
  }

  .identity{ text-align:center; display:flex; flex-direction:column; gap:6px; }
  .name{
    font-size:26px;
    font-weight:700;
    margin:0;
    letter-spacing:0.01em;
    text-shadow: 0 2px 12px rgba(0,0,0,.65);
  }
  .tagline{
    margin:0;
    font-size:14px;
    color:var(--fg-dim);
    text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-btn{
    position:relative;
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    border-radius:14px;
    background:var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border:1px solid var(--panel-border);
    color:var(--fg);
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .link-btn:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
  }
  .link-btn:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }
  .link-btn .ic{
    width:22px;height:22px;flex:none;
    color:var(--accent-2);
  }
  .link-btn .label{flex:1; min-width:0;}
  .link-btn .sub{
    display:block;
    font-size:12px;
    font-weight:500;
    color:var(--fg-dim);
    margin-top:1px;
  }
  .link-btn .arrow{
    flex:none;
    color:var(--fg-dim);
    font-size:18px;
    transform:translateX(0);
    transition:transform .15s ease;
  }
  .link-btn:hover .arrow{ transform:translateX(3px); }

  .link-btn.twitch{ border-color:color-mix(in srgb, #9146FF 35%, var(--panel-border)); }
  .link-btn.twitch .ic{ color:#9146FF; }

  .link-btn.disabled{
    opacity:.55;
    cursor:default;
    pointer-events:none;
  }
  .link-btn.disabled .arrow{ display:none; }
  .soon-chip{
    flex:none;
    font-size:10px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent-2);
    border:1px solid var(--panel-border);
    border-radius:999px;
    padding:3px 8px;
  }

  .socials{
    display:flex;
    gap:14px;
    margin-top:4px;
  }
  .social-ic{
    width:40px;height:40px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border:1px solid var(--panel-border);
    color:var(--fg-dim);
    text-decoration:none;
    transition: color .15s ease, border-color .15s ease;
  }
  .social-ic:hover{ color:var(--accent-2); border-color:var(--accent); }
  .social-ic:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .social-ic svg{ width:18px;height:18px; }

  footer{
    color:var(--fg-dim);
    font-size:11px;
    text-align:center;
    letter-spacing:.03em;
  }
</style>
</head>
<body>

<div class="page">

  <div class="avatar-wrap">
    <img class="avatar" src="img/logo.png" alt="roitcore Logo" width="112" height="112">
    <div class="live-chip"><span class="live-dot"></span>Offline</div>
  </div>

  <div class="identity">
    <h1 class="name">roitcore</h1>
    <p class="tagline">Warzone-Streams &amp; Clips auf der PS5</p>

  <nav class="links" aria-label="Links">

      <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 5.3a17.6 17.6 0 0 0-4.3-1.3l-.2.4a13 13 0 0 1 3.7 1.3A16.9 16.9 0 0 0 12 4a16.9 16.9 0 0 0-7.5 1.7 13 13 0 0 1 3.7-1.3l-.2-.4a17.6 17.6 0 0 0-4.3 1.3C1.6 8.9 1 13 1.3 17a17.8 17.8 0 0 0 5.2 2.6l.6-1a13 13 0 0 1-2-1 12 12 0 0 0 1.3.6 15.6 15.6 0 0 0 11.2 0 12 12 0 0 0 1.3-.6 13 13 0 0 1-2 1l.6 1a17.8 17.8 0 0 0 5.2-2.6c.4-4.3-.5-8.3-2.4-11.7ZM8.8 14.6a1.6 1.6 0 1 1 1.5-1.6 1.6 1.6 0 0 1-1.5 1.6Zm6.4 0a1.6 1.6 0 1 1 1.5-1.6 1.6 1.6 0 0 1-1.5 1.6Z"/></svg>
      <span class="label">Discord<span class="sub">Community-Server</span></span>
      <span class="soon-chip">Bald</span>
    </div>

  </nav>

  <div class="socials">
    <a class="social-ic" href="https://www.twitch.tv/roitcore" target="_blank" rel="noopener" aria-label="Twitch">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 2 2.5 5.5v14H8V22h3l2.5-2.5H18L21.5 16V2H4Z"/></svg>
    </a>
    <a class="social-ic" href="https://www.youtube.com/@Roitcore" target="_blank" rel="noopener" aria-label="YouTube">

  <footer>roitcore · alle Links an einem Ort</footer>

</div>
</body>
</html>
